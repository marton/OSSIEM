---
# Plain-Docker install of the OSSIEM stack (for Coolify see DEPLOY.md).
# Certificates, indexer users, the Graylog truststore and the Velociraptor API
# client are created by the compose init services, so this only prepares the host.
#
# Provide the variables from .env.example, e.g.:
#   ansible-playbook -i host, setup_ossiem.yaml -e env_file=./my.env
- name: Setup OSSIEM Stack
  hosts: all
  become: true
  vars:
    repo_url: "https://github.com/marton/OSSIEM"
    install_path: "/root"
    repo_name: "OSSIEM"
    project_root: "{{ install_path }}/{{ repo_name }}"
    # Local file with the values from .env.example
    env_file: ""

  tasks:
    - name: Require an env file
      ansible.builtin.assert:
        that: env_file | length > 0
        fail_msg: "Pass -e env_file=<path to your filled-in .env>"

    - name: Clone the repository
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ project_root }}"
        version: main
        force: yes

    - name: Install the environment file
      ansible.builtin.copy:
        src: "{{ env_file }}"
        dest: "{{ project_root }}/.env"
        mode: '0600'

    - name: Update the max memory map
      ansible.posix.sysctl:
        name: vm.max_map_count
        value: '262144'
        state: present
        reload: yes

    - name: Update network receive buffer
      ansible.posix.sysctl:
        name: net.core.rmem_max
        value: '1048576'
        state: present
        reload: yes

    - name: Pre-pull the File Analysis inspector image
      ansible.builtin.command:
        cmd: docker pull ghcr.io/socfortress/copilot-inspector:latest

    - name: Run docker compose up
      ansible.builtin.command:
        cmd: docker compose up -d --build
        chdir: "{{ project_root }}"

    - name: Retrieve SOCFortress CoPilot password
      ansible.builtin.shell:
        cmd: docker compose logs copilot-backend 2>&1 | grep "Admin user password"
        chdir: "{{ project_root }}"
      register: copilot_password
      retries: 30
      delay: 10
      until: copilot_password.rc == 0
      ignore_errors: true

    - name: Display CoPilot Password
      ansible.builtin.debug:
        msg: "{{ copilot_password.stdout_lines | default('Password not found yet') }}"
