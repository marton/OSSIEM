# OSSIEM: Wazuh + Graylog + Grafana + Velociraptor + SOCFortress CoPilot.
#
# Built to deploy as a single Coolify "Docker Compose" resource from git, and
# also runs with plain `docker compose up -d`. See DEPLOY.md.
#
# - Site-specific values and secrets come from the environment (Coolify's
#   Environment Variables, or a local .env); .env.example lists them all.
# - One-shot init services replace the manual setup steps: certificates,
#   indexer users, Graylog truststore, Velociraptor API client.
# - Host ports avoid the ones Coolify uses itself (80, 443, 8000, 8080, 6001, 6002).

services:
  ########
  # Init #
  ########
  # Generates the Wazuh TLS certificates once into the wazuh-certs volume.
  wazuh-certs:
    image: wazuh/wazuh-certs-generator:0.0.5
    entrypoint: ["/bin/bash", "/init/wazuh-certs.sh"]
    environment:
      - CERT_TOOL_VERSION=4.14
    volumes:
      - wazuh-certs:/certificates
      - ./wazuh/config/certs.yml:/config/certs.yml:ro
      - ./init:/init:ro
    restart: "no"

  # Writes the indexer's security config with hashes of INDEXER_PASSWORD and
  # DASHBOARD_PASSWORD (first deploy only).
  wazuh-indexer-security:
    image: wazuh/wazuh-indexer:${WAZUH_VERSION:-4.14.1}
    user: "0"
    entrypoint: ["/bin/bash", "/init/indexer-security.sh"]
    environment:
      - INDEXER_PASSWORD=${INDEXER_PASSWORD:?Set INDEXER_PASSWORD}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:?Set DASHBOARD_PASSWORD}
    volumes:
      - wazuh-indexer-security:/security
      - ./init:/init:ro
    restart: "no"

  # Java truststore with the Wazuh root CA, so Graylog trusts the indexer.
  graylog-truststore:
    image: graylog/graylog:6.0.6
    user: "0"
    entrypoint: ["/bin/bash", "/init/graylog-truststore.sh"]
    volumes:
      - graylog-truststore:/truststore
      - wazuh-certs:/certs:ro
      - ./init:/init:ro
    depends_on:
      wazuh-certs:
        condition: service_completed_successfully
    restart: "no"

  #########
  # Wazuh #
  #########
  wazuh.manager:
    image: ghcr.io/socfortress/wazuh-manager:${WAZUH_VERSION:-4.14.1}
    hostname: wazuh.manager
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    ports:
      # Agent events and enrollment, Wazuh API
      - "1514:1514"
      - "1515:1515"
      - "55000:55000"
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${INDEXER_PASSWORD:?Set INDEXER_PASSWORD}
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/wazuh/root-ca-manager.pem
      - SSL_CERTIFICATE=/etc/ssl/wazuh/wazuh.manager.pem
      - SSL_KEY=/etc/ssl/wazuh/wazuh.manager-key.pem
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${WAZUH_API_PASSWORD:?Set WAZUH_API_PASSWORD}
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - fluent-bit:/etc/fluentbit
      - type: volume
        source: wazuh-certs
        target: /etc/ssl/wazuh
        read_only: true
        volume:
          nocopy: true
      - ./wazuh/config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf
    depends_on:
      wazuh-certs:
        condition: service_completed_successfully
    restart: unless-stopped

  # SOCFortress WAZUH-UTILS: lets CoPilot place Sysmon configs/scripts into agent
  # group shared folders. Built from wazuh/wazuh-utils; reachable only on the stack
  # network (CoPilot uses https://wazuh-utils:5003).
  wazuh-utils:
    build:
      context: ./wazuh/wazuh-utils
    image: ossiem/wazuh-utils:local
    hostname: wazuh-utils
    environment:
      - WAZUH_UTILS_API_KEY=${WAZUH_UTILS_API_KEY:?Set WAZUH_UTILS_API_KEY}
      - WAZUH_UTILS_SHARED_DIR=/var/ossec/etc/shared
    volumes:
      - type: volume
        source: wazuh_etc
        target: /var/ossec/etc
        volume:
          nocopy: true
      - wazuh-utils-tls:/tls
    depends_on:
      - wazuh.manager
    restart: unless-stopped

  wazuh.indexer:
    image: wazuh/wazuh-indexer:${WAZUH_VERSION:-4.14.1}
    hostname: wazuh.indexer
    # Not published: Graylog, CoPilot and the dashboard reach it on the stack network.
    environment:
      - "OPENSEARCH_JAVA_OPTS=${INDEXER_JAVA_OPTS:--Xms1g -Xmx1g}"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      # nocopy: otherwise Docker seeds the empty volumes with the image's demo files
      - type: volume
        source: wazuh-certs
        target: /usr/share/wazuh-indexer/config/certs
        read_only: true
        volume:
          nocopy: true
      - type: volume
        source: wazuh-indexer-security
        target: /usr/share/wazuh-indexer/config/opensearch-security
        volume:
          nocopy: true
      - ./wazuh/config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml:ro
    healthcheck:
      # 401 means up with security enabled
      test: ["CMD-SHELL", "curl -sk -o /dev/null -w '%{http_code}' https://localhost:9200 | grep -qE '^(200|401)'"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s
    depends_on:
      wazuh-certs:
        condition: service_completed_successfully
      wazuh-indexer-security:
        condition: service_completed_successfully
    restart: unless-stopped

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:${WAZUH_VERSION:-4.14.1}
    hostname: wazuh.dashboard
    ports:
      - "${WAZUH_DASHBOARD_PORT:-5601}:5601"
    environment:
      - WAZUH_API_URL=https://wazuh.manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:?Set DASHBOARD_PASSWORD}
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${WAZUH_API_PASSWORD:?Set WAZUH_API_PASSWORD}
    volumes:
      - type: volume
        source: wazuh-certs
        target: /usr/share/wazuh-dashboard/certs
        read_only: true
        volume:
          nocopy: true
      - ./wazuh/config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
      # wazuh.yml is written here from API_USERNAME/API_PASSWORD on first start
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    depends_on:
      wazuh.indexer:
        condition: service_healthy
    restart: unless-stopped

  ###########
  # Graylog #
  ###########
  # MongoDB: https://hub.docker.com/_/mongo/ (needs a CPU with AVX)
  mongodb:
    image: mongo:6.0.14
    hostname: mongodb
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Graylog: https://hub.docker.com/r/graylog/graylog/
  graylog:
    image: graylog/graylog:6.0.6
    hostname: graylog
    entrypoint: ["tini", "--", "/bin/bash", "/init/graylog-entrypoint.sh"]
    command: ["server"]
    environment:
      GRAYLOG_SERVER_JAVA_OPTS: "-Dlog4j2.formatMsgNoLookups=true -Djavax.net.ssl.trustStore=/usr/share/graylog/truststore/cacerts -Djavax.net.ssl.trustStorePassword=changeit"
      GRAYLOG_PASSWORD_SECRET: ${GRAYLOG_PASSWORD_SECRET:?Set GRAYLOG_PASSWORD_SECRET}
      GRAYLOG_ROOT_PASSWORD: ${GRAYLOG_ROOT_PASSWORD:?Set GRAYLOG_ROOT_PASSWORD}
      GRAYLOG_ELASTICSEARCH_HOSTS: https://admin:${INDEXER_PASSWORD:?Set INDEXER_PASSWORD}@wazuh.indexer:9200
    volumes:
      - graylog_data:/usr/share/graylog/data
      - graylog-truststore:/usr/share/graylog/truststore:ro
      - ./init:/init:ro
      - ./graylog/graylog.conf:/usr/share/graylog/data/config/graylog.conf:ro
      - ./graylog/log4j2.xml:/usr/share/graylog/data/config/log4j2.xml:ro
      - ./graylog/GeoLite2-City.mmdb:/usr/share/graylog/data/config/GeoLite2-City.mmdb:ro
      - ./graylog/GeoLite2-ASN.mmdb:/usr/share/graylog/data/config/GeoLite2-ASN.mmdb:ro
      - ./graylog/network_ports.csv:/etc/graylog/network_ports.csv:ro
      - ./graylog/software_vendors.csv:/etc/graylog/software_vendors.csv:ro
    ports:
      # Graylog web interface and REST API
      - "${GRAYLOG_PORT:-9000}:9000"
      # Syslog TCP (Disabled for compatibility with the Wazuh Manager)
      # - 1514:1514
      # Syslog UDP SophosFW
      - "514:514/udp"
      # Syslog UDP SophosFW
      - "2514:2514/udp"
      # GELF TCP
      - "12201:12201"
      # GELF UDP
      - "12201:12201/udp"
    depends_on:
      mongodb:
        condition: service_healthy
      wazuh.indexer:
        condition: service_healthy
      graylog-truststore:
        condition: service_completed_successfully
    restart: unless-stopped

  ###########
  # Grafana #
  ###########
  grafana:
    image: grafana/grafana-enterprise:12.4.15
    hostname: grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
    restart: unless-stopped

  ################
  # Velociraptor #
  ################
  velociraptor:
    image: wlambert/velociraptor:0.76.3
    hostname: velociraptor
    entrypoint: ["/bin/bash", "/init/velociraptor-entrypoint.sh"]
    environment:
      - VELOX_USER=${VELOX_USER:-admin}
      - VELOX_PASSWORD=${VELOX_PASSWORD:?Set VELOX_PASSWORD}
      - VELOX_ROLE=administrator
      # Baked into client configs on first start: must be reachable by endpoints
      - VELOX_SERVER_URL=https://${STACK_HOST:?Set STACK_HOST}:${VELOCIRAPTOR_FRONTEND_PORT:-8100}/
      - VELOX_FRONTEND_HOSTNAME=${STACK_HOST:?Set STACK_HOST}
    volumes:
      - velociraptor:/velociraptor/:rw
      - velociraptor-api:/velociraptor-api
      - ./init:/init:ro
    ports:
      # Client frontend (container 8000; host 8000 belongs to Coolify)
      - "${VELOCIRAPTOR_FRONTEND_PORT:-8100}:8000"
      # Web GUI. The gRPC API (8001) stays on the stack network.
      - "${VELOCIRAPTOR_GUI_PORT:-8889}:8889"
    restart: unless-stopped

  ###########
  # CoPilot #
  ###########
  copilot-backend:
    image: ghcr.io/socfortress/copilot-backend:latest
    hostname: copilot-backend
    env_file: copilot.env
    environment:
      - SERVER_IP=0.0.0.0
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET}
      - SSO_STATE_SECRET=${SSO_STATE_SECRET:?Set SSO_STATE_SECRET}
      - TOTP_ENCRYPTION_KEY=${TOTP_ENCRYPTION_KEY:?Set TOTP_ENCRYPTION_KEY}
      - WAF_TOKEN_ENCRYPTION_KEY=${WAF_TOKEN_ENCRYPTION_KEY:?Set WAF_TOKEN_ENCRYPTION_KEY}
      - GRAFANA_API_HEADER_VALUE=${GRAFANA_API_HEADER_VALUE:?Set GRAFANA_API_HEADER_VALUE}
      - WAF_SYSLOG_DEFAULT_HOST=${STACK_HOST:?Set STACK_HOST}
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-localhost}
      - WEBAUTHN_ORIGINS=${WEBAUTHN_ORIGINS:-}
      - MYSQL_URL=copilot-mysql
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      - MYSQL_USER=copilot
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      - MINIO_URL=copilot-minio
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      # Connectors seeded on first start
      - WAZUH_INDEXER_URL=https://wazuh.indexer:9200
      - WAZUH_INDEXER_USERNAME=admin
      - WAZUH_INDEXER_PASSWORD=${INDEXER_PASSWORD:?Set INDEXER_PASSWORD}
      - WAZUH_MANAGER_URL=https://wazuh.manager:55000
      - WAZUH_MANAGER_USERNAME=wazuh-wui
      - WAZUH_MANAGER_PASSWORD=${WAZUH_API_PASSWORD:?Set WAZUH_API_PASSWORD}
      - GRAYLOG_URL=http://graylog:9000
      - GRAYLOG_USERNAME=admin
      - GRAYLOG_PASSWORD=${GRAYLOG_ROOT_PASSWORD:?Set GRAYLOG_ROOT_PASSWORD}
      - GRAFANA_URL=http://grafana:3000
      - GRAFANA_USERNAME=admin
      - GRAFANA_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      - VELOCIRAPTOR_URL=https://velociraptor:8889
      - VELOCIRAPTOR_API_KEY_PATH=/velociraptor-api/api.config.yaml
      - VELOCIRAPTOR_API_CONFIG=/velociraptor-api/api.config.yaml
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-REPLACE_ME}
      # WAZUH-UTILS sidecar (self-signed cert, not verified; the key authenticates)
      - WAZUH_UTILS_URL=https://wazuh-utils:5003
      - WAZUH_UTILS_API_KEY=${WAZUH_UTILS_API_KEY:?Set WAZUH_UTILS_API_KEY}
      # CoPilot MCP
      - OPENAI_API_KEY=${OPENAI_API_KEY:-REPLACE_ME}
      - OPENSEARCH_URL=https://wazuh.indexer:9200
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=${INDEXER_PASSWORD:?Set INDEXER_PASSWORD}
      - WAZUH_PROD_URL=https://wazuh.manager:55000
      - WAZUH_PROD_USERNAME=wazuh-wui
      - WAZUH_PROD_PASSWORD=${WAZUH_API_PASSWORD:?Set WAZUH_API_PASSWORD}
      - MCP_OPENSEARCH_AUTH_TOKEN=${MCP_AUTH_TOKEN:?Set MCP_AUTH_TOKEN}
      - MCP_MYSQL_AUTH_TOKEN=${MCP_AUTH_TOKEN:?Set MCP_AUTH_TOKEN}
      - MCP_WAZUH_AUTH_TOKEN=${MCP_AUTH_TOKEN:?Set MCP_AUTH_TOKEN}
      - MCP_VELOCIRAPTOR_AUTH_TOKEN=${MCP_AUTH_TOKEN:?Set MCP_AUTH_TOKEN}
    # Expose the Ports for Graylog Alerting and Docs
    ports:
      - "${COPILOT_BACKEND_PORT:-5000}:5000"
    volumes:
      - copilot-logs:/opt/logs
      # Mount the copilot.db file to persist the database
      - copilot-data:/opt/copilot/backend/data
      - velociraptor-api:/velociraptor-api:ro
    depends_on:
      copilot-mysql:
        condition: service_healthy
      copilot-minio:
        condition: service_started
    restart: unless-stopped

  copilot-frontend:
    image: ghcr.io/socfortress/copilot-frontend:latest
    hostname: copilot-frontend
    environment:
      # CN of the self-signed certificate generated on first start
      - SERVER_HOST=${STACK_HOST:?Set STACK_HOST}
      - SERVER_PORT=${COPILOT_HTTPS_PORT:-8443}
    ports:
      # Port 80 inside only redirects to https; host 80/443 belong to Coolify's proxy
      - "${COPILOT_HTTPS_PORT:-8443}:443"
    volumes:
      # Keep the self-signed certificate and DH params across redeploys
      - copilot-frontend-tls:/etc/nginx/certs.d
      - copilot-frontend-dhparams:/etc/nginx/certs
    depends_on:
      - copilot-backend
    restart: unless-stopped

  # Customer-facing portal (optional upstream CoPilot service)
  copilot-customer-portal:
    image: ghcr.io/socfortress/copilot-customer-portal:latest
    hostname: copilot-customer-portal
    environment:
      - SERVER_HOST=${STACK_HOST:?Set STACK_HOST}
      - SERVER_PORT=${COPILOT_PORTAL_PORT:-8444}
    ports:
      - "${COPILOT_PORTAL_PORT:-8444}:443"
    volumes:
      - copilot-portal-tls:/etc/nginx/certs.d
      - copilot-portal-dhparams:/etc/nginx/certs
    depends_on:
      - copilot-backend
    restart: unless-stopped

  copilot-mysql:
    # MySQL 8.4 LTS, as in upstream CoPilot
    image: mysql:8.4.13
    hostname: copilot-mysql
    command:
      # CoPilot's foreign keys point at non-unique indexes, which MySQL 8.4
      # otherwise refuses (see upstream CoPilot docker-compose.yml)
      - --restrict-fk-on-non-standard-key=OFF
      - --mysql-native-password=ON
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: copilot
      MYSQL_USER: copilot
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
    volumes:
      - copilot-mysql_data:/var/lib/mysql
    healthcheck:
      # Exits 0 whenever the server answers, even with access denied
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  copilot-minio:
    image: ghcr.io/socfortress/minio:RELEASE.2024-09-13T20-26-02Z
    hostname: copilot-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - copilot_minio-data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  copilot-nuclei-module:
    image: ghcr.io/socfortress/copilot-nuclei-module:latest
    hostname: copilot-nuclei-module
    restart: unless-stopped

  copilot-mcp:
    image: ghcr.io/socfortress/copilot-mcp:latest
    hostname: copilot-mcp
    volumes:
      # api.config.yaml is written by init/velociraptor-entrypoint.sh
      - velociraptor-api:/velociraptor-api:ro
    environment:
      # Core OpenAI Configuration
      - OPENAI_API_KEY=${OPENAI_API_KEY:-REPLACE_ME}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}

      # Application Configuration
      - APP_HOST=0.0.0.0
      - APP_PORT=80
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

      # MCP Server Process Management
      - MCP_SERVER_ENABLED=true
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=9900

      # OpenSearch (the Wazuh indexer)
      - OPENSEARCH_URL=https://wazuh.indexer:9200
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=${INDEXER_PASSWORD:?Set INDEXER_PASSWORD}
      - OPENSEARCH_SSL_VERIFY=false
      - OPENSEARCH_SSL_SHOW_WARN=false

      # OpenSearch MCP Server Configuration
      - MCP_OPENSEARCH_URL=http://copilot-mcp:9900/sse
      - MCP_OPENSEARCH_AUTH_TOKEN=${MCP_AUTH_TOKEN:?Set MCP_AUTH_TOKEN}

      # MySQL
      - MYSQL_ENABLED=true
      - MYSQL_HOST=copilot-mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=copilot
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      - MYSQL_DATABASE=copilot

      # MySQL MCP Server Configuration
      - MCP_MYSQL_URL=http://copilot-mcp:9901/sse
      - MCP_MYSQL_AUTH_TOKEN=${MCP_AUTH_TOKEN:?Set MCP_AUTH_TOKEN}
      - MCP_MYSQL_SERVER_ENABLED=true
      - MCP_MYSQL_SERVER_HOST=0.0.0.0
      - MCP_MYSQL_SERVER_PORT=9901

      # Wazuh manager API
      - WAZUH_PROD_URL=https://wazuh.manager:55000
      - WAZUH_PROD_USERNAME=wazuh-wui
      - WAZUH_PROD_PASSWORD=${WAZUH_API_PASSWORD:?Set WAZUH_API_PASSWORD}
      - WAZUH_PROD_SSL_VERIFY=false
      - WAZUH_PROD_TIMEOUT=30

      # Wazuh MCP Server Configuration
      - MCP_WAZUH_URL=http://copilot-mcp:8000/sse
      - MCP_WAZUH_AUTH_TOKEN=${MCP_AUTH_TOKEN:?Set MCP_AUTH_TOKEN}
      - MCP_WAZUH_SERVER_ENABLED=true
      - MCP_WAZUH_HOST=0.0.0.0
      - MCP_WAZUH_PORT=8000

      # Velociraptor
      - VELOCIRAPTOR_API_KEY=/velociraptor-api/api.config.yaml
      - VELOCIRAPTOR_SSL_VERIFY=false
      - VELOCIRAPTOR_TIMEOUT=30

      # Velociraptor MCP Server Configuration
      - MCP_VELOCIRAPTOR_URL=http://copilot-mcp:8001/sse
      - MCP_VELOCIRAPTOR_AUTH_TOKEN=${MCP_AUTH_TOKEN:?Set MCP_AUTH_TOKEN}
      - MCP_VELOCIRAPTOR_SERVER_ENABLED=true
      - MCP_VELOCIRAPTOR_HOST=0.0.0.0
      - MCP_VELOCIRAPTOR_PORT=8001
    depends_on:
      copilot-mysql:
        condition: service_healthy
    restart: unless-stopped

  # --- CoPilot File Analysis (Tier 1 static inspection) ----------------------
  # copilot-backend talks HTTP to inspector-runner, which spawns one hardened
  # copilot-inspector container per job through an allowlisting socket proxy.
  # The runner cannot pull images: pre-pull ghcr.io/socfortress/copilot-inspector:latest
  # on the host (see DEPLOY.md).
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.2.0
    environment:
      # Allow ONLY what the runner needs to spawn/attach/kill per-job containers.
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
      BUILD: 0
      EXEC: 0
      VOLUMES: 0
      NETWORKS: 0
      SWARM: 0
      SERVICES: 0
      SECRETS: 0
      INFO: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - inspector-internal
    restart: unless-stopped

  inspector-runner:
    image: ghcr.io/socfortress/copilot-inspector-runner:latest
    hostname: inspector-runner
    environment:
      INSPECTOR_MODE: container
      FILE_ANALYSIS_DEV_MODE: "false"
      INSPECTOR_IMAGE: ghcr.io/socfortress/copilot-inspector:latest
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      INSPECTOR_MAX_CONCURRENT: "2"
      INSPECTOR_JOB_TIMEOUT: "180"
      INSPECTOR_MEM_LIMIT: "1g"
      INSPECTOR_PIDS_LIMIT: "256"
      INSPECTOR_CPUS: "1.0"
      CLAMAV_ENABLED: "false"
    depends_on:
      - docker-socket-proxy
    networks:
      - inspector-internal
      - default
    restart: unless-stopped

